      "臨床：腎絞痛、血尿、阻塞與感染"
    ]],
    ["Hydronephrosis（水腎）", ["腎盂腎盞擴張 + 實質萎縮", "原因：結石、前列腺增生、腫瘤、懷孕", "先傷腎小管濃縮功能", "雙側不完全阻塞 → 多尿；完全阻塞 → 無尿"]]
  ]],
  ["腫瘤", [
    ["Oncocytoma（良性）", ["來自集尿管間細胞", "富含粒線體；中央星狀疤痕"]],
    ["Renal cell carcinoma|RCC 腎細胞癌", [
      "危險因子：吸菸、高血壓、肥胖、透析",
      ["Clear cell（約 65%）", ["<i>VHL</i> 失活（3p）→ HIF 累積 → VEGF → 血管新生", "黃色腫瘤，侵犯腎靜脈", "細胞質透明（脂質、肝醣）"]],
      ["Papillary（10–15%）", ["<i>MET</i>（7q）", "常多發、雙側"]],
      ["Chromophobe（5%）", ["低倍體", "核周空暈；預後較好"]],
      ["臨床", ["血尿最常見", "三徵：血尿、腫塊、腰痛（少同時出現）", "Paraneoplastic：紅血球增多症、高血鈣", "轉移：肺、骨"]]
    ]],
    ["Wilms tumor（腎母細胞瘤）", ["兒童（多為 2–5 歲）腹部大腫塊", "三相性：胚芽、基質、上皮", "<i>WT1</i>；WAGR、Denys-Drash、Beckwith-Wiedemann"]]
  ]]
]]
];

const tree = document.getElementById("tree");
const tabs = [...document.querySelectorAll('[role="tab"]')];
const names = ["overview", "lecture-1", "lecture-2", "lecture-3"];
let cur = 0;

function labelHTML(t) {
  const [a, b] = t.split("|");
  return b ? a + "<small>" + b + "</small>" : a;
}
function build(item, depth) {
  const node = document.createElement("div");
  const isLeaf = typeof item === "string";
  const kids = isLeaf ? null : item[1];
  node.className = "node " + (isLeaf ? "leaf" : "d" + Math.min(depth, 3));
  const el = document.createElement(isLeaf ? "div" : "button");
  el.className = "label";
  el.innerHTML = labelHTML(isLeaf ? item : item[0]);
  node.appendChild(el);
  if (kids) {
    const box = document.createElement("div");
    box.className = "kids";
    kids.forEach((k) => {
      const br = document.createElement("div");
      br.className = "branch";
      br.appendChild(build(k, depth + 1));
      box.appendChild(br);
    });
    const open = depth < 1 || (depth === 1 && cur === 0);
    box.hidden = !open;
    el.setAttribute("aria-expanded", String(open));
    el.addEventListener("click", () => {
      box.hidden = !box.hidden;
      el.setAttribute("aria-expanded", String(!box.hidden));
    });
    node.appendChild(box);
  }
  return node;
}
function show(i) {
  cur = i;
  tabs.forEach((t, j) => t.setAttribute("aria-selected", String(j === i)));
  tree.replaceChildren(build(M[i], 0));
}
function setAll(open) {
  tree.querySelectorAll(".kids").forEach((k) => {
    const root = k.parentElement.classList.contains("d0");
    k.hidden = root ? false : !open;
    k.previousElementSibling.setAttribute("aria-expanded", String(!k.hidden));
  });
}
function fromHash() {
  const i = names.indexOf(location.hash.slice(1));
  show(i < 0 ? 0 : i);
}
tabs.forEach((t) => t.addEventListener("click", () => {
  const i = +t.dataset.i;
  try { location.hash = names[i]; } catch (e) {}
  show(i);
}));
document.getElementById("open-all").addEventListener("click", () => setAll(true));
document.getElementById("close-all").addEventListener("click", () => setAll(false));
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
